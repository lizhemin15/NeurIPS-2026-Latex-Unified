name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            neurips2026_formatting_instructions.tex

      - name: Source archive (tracked files only)
        run: git archive --format=zip -o "NeurIPS-2026-Latex-Unified-${{ github.ref_name }}-source.zip" HEAD

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.pdf
            neurips2026_formatting_instructions.pdf
            NeurIPS-2026-Latex-Unified-${{ github.ref_name }}-source.zip
